<!doctype html>
<!--
  English alias for /eliminar-cuenta. Play Console is filled in in English and
  the reviewer reads English, so the URL we hand them should be guessable in
  English too — but the policy itself lives in one place, so the two can never
  drift apart.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Delete your viaxi account</title>
  <link rel="canonical" href="https://viaxi.app/eliminar-cuenta/" />
  <meta http-equiv="refresh" content="0; url=/eliminar-cuenta/" />
  <script>location.replace('/eliminar-cuenta/');</script>
</head>
<body>
  <p>Redirecting to <a href="/eliminar-cuenta/">viaxi.app/eliminar-cuenta</a>…</p>
</body>
</html>
